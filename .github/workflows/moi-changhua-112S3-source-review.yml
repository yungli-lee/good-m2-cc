name: MOI Changhua 112S3 source exception review
on:
  push:
    branches: [feature/real-price-public-search-v1]
    paths: [.github/workflows/moi-changhua-112S3-source-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-112S3:
    if: github.ref == 'refs/heads/feature/real-price-public-search-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOI_SEASON: '112S3'
      MOI_LOCAL_ZIP: /tmp/changhua-112S3.zip
      MOI_REPORT_PATH: /tmp/changhua-112S3-report.json
      MOI_CHECK_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official 112S3 archive
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 \
            --connect-timeout 20 --max-time 240 --output "$MOI_LOCAL_ZIP" \
            'https://plvr.land.moi.gov.tw/DownloadSeason?season=112S3&type=zip&fileName=lvr_landcsv.zip'
      - name: Validate all scoped records and record exceptions (no import)
        run: |
          python scripts/moi_changhua_2023_backfill.py
          python - <<'PY'
          import json,os
          r=json.load(open(os.environ['MOI_REPORT_PATH']))
          print(json.dumps({'season':r['season'],'masters':sum(i['source_masters'] for i in r['inventory']),
                            'parsed':sum(i['valid_masters'] for i in r['inventory']),
                            'unresolved_issues':r['unresolved_issues'],
                            'issue_reasons':[i.get('reason') for i in r['issues']]},ensure_ascii=False))
          PY
      - name: Preserve source reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changhua-112S3-source-review-${{ github.run_id }}
          path: /tmp/changhua-112S3-report.json
          retention-days: 30
