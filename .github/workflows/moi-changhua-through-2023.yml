name: Changhua sale presale backfill through 2023
on:
  push:
    branches: [feature/real-price-public-search-v1]
    paths: [.github/workflows/moi-changhua-through-2023.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moi-staging-raw-ingest
  cancel-in-progress: false
jobs:
  quarter-115S3:
    uses: ./.github/workflows/moi-changhua-scoped-quarter.yml
    secrets: inherit
    with:
      season: 115S3
  quarter-115S2:
    needs: quarter-115S3
