name: Changhua 108 annual backfill
on:
  push:
    branches: [feature/real-price-public-search-v1]
    paths: [.github/workflows/moi-changhua-year108.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moi-staging-raw-ingest
  cancel-in-progress: false
jobs:
  quarter-108S4:
    uses: ./.github/workflows/moi-changhua-year108-quarter.yml
    secrets: inherit
    with:
      season: 108S4
  quarter-108S3:
    needs: quarter-108S4
    uses: ./.github/workflows/moi-changhua-year108-quarter.yml
    secrets: inherit
    with:
      season: 108S3
  quarter-108S2:
    needs: quarter-108S3
    uses: ./.github/workflows/moi-changhua-year108-quarter.yml
    secrets: inherit
    with:
      season: 108S2
  quarter-108S1:
    needs: quarter-108S2
    uses: ./.github/workflows/moi-changhua-year108-quarter.yml
    secrets: inherit
    with:
      season: 108S1
