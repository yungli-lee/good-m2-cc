name: Changhua 110 annual backfill
on:
  push:
    branches: [feature/real-price-public-search-v1]
    paths: [.github/workflows/moi-changhua-year110.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moi-staging-raw-ingest
  cancel-in-progress: false
jobs:
  quarter-110S2:
    uses: ./.github/workflows/moi-changhua-year110-quarter.yml
    secrets: inherit
    with:
      season: 110S2
  quarter-110S1:
    needs: quarter-110S2
    uses: ./.github/workflows/moi-changhua-year110-quarter.yml
    secrets: inherit
    with:
      season: 110S1

# Resume only reviewed S2 and S1 sources; S4 and S3 already reconciled.
