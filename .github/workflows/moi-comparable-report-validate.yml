name: Validate database-driven real-price A4 report builder
on:
  push:
    branches: [main]
    paths: [.github/workflows/moi-comparable-report-validate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca74b85ff9bd5321b092d7a38dfb53ca0d4332cf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - name: Install without changing the lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Parse synthetic official four-sheet XLS end to end
        run: node --experimental-strip-types scripts/test-official-xls-import.mjs
      - name: Confirm report access and publication gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'await requireRole(["editor", "admin", "owner"])' app/admin/real-price-reports/page.tsx
          grep -F 'REAL_PRICE_PUBLIC_SEARCH_ENABLED' app/api/public/real-price/route.ts
          grep -F '!previewStaging && !publicEnabled' app/api/public/real-price/route.ts
          ! grep -F 'real-price-reports' app/layout.tsx
