name: Validate real-price A4 report builder in feature branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/moi-comparable-report-validate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24cefc189f39773309c29c19ea0e2b785ca623f5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - name: Install without changing the lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Confirm report access and publication gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'await requireRole(["editor", "admin", "owner"])' app/admin/real-price-reports/page.tsx
          grep -F 'moi_publication_state' app/api/public/real-price/route.ts
          grep -F 'enabled!==true' app/api/public/real-price/route.ts
          ! grep -F 'real-price-reports' app/layout.tsx
