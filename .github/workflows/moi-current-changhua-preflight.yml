name: MOI current Changhua read-only preflight
on:
  push:
    branches: [feature/real-price-public-search-v1]
    paths: [.github/workflows/moi-current-changhua-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/feature/real-price-public-search-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STAGING_SUPABASE_URL: ${{ secrets.MOI_STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOI_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      MOI_LOCAL_ZIP: /tmp/moi-current-changhua.zip
      MOI_REPORT_PATH: /tmp/moi-current-changhua-preflight.json
      MOI_CHECK_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source and check archive integrity
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 240 \
            --output "$MOI_LOCAL_ZIP" 'https://plvr.land.moi.gov.tw/Download?type=zip&fileName=lvr_landcsv.zip'
          python - <<'PY'
          import os,zipfile
          p=os.environ["MOI_LOCAL_ZIP"]
          if not zipfile.is_zipfile(p):raise SystemExit("Official data is not a ZIP")
          with zipfile.ZipFile(p) as z:
              if z.testzip() is not None:raise SystemExit("ZIP checksum failed")
          PY
      - name: Inspect only current Changhua new transactions (no database writes)
        run: python scripts/moi_current_changhua_update.py
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moi-current-changhua-preflight-${{ github.run_id }}
          path: /tmp/moi-current-changhua-preflight.json
          retention-days: 30
