name: MOI Production paced resume (200 records maximum)
on:
  push:
    branches: [main]
    paths: [.github/workflows/moi-production-paced-resume.yml]
  workflow_dispatch:
  schedule:
    # 00:07-07:52 Asia/Taipei, every 15 minutes (32 runs/day, max 6400/day).
    # GitHub cron is UTC; staggering offsets avoids top-of-hour load.
    - cron: '7,22,37,52 16-23 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: moi-one-time-production-transfer
  cancel-in-progress: false
jobs:
  paced-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MOI_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOI_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      MOI_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOI_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY || secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e4d7ebdc2d2e07bd527f3954de57de6fdbf55b0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight credentials (never print values)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOI_STAGING_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$MOI_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY"
      - name: Fail closed if the previous import run failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GH_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/moi-production-paced-resume.yml/runs?status=completed&per_page=10"
          request=urllib.request.Request(url,headers={
            "Accept":"application/vnd.github+json",
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(request,timeout=20) as response:
              runs=json.load(response)["workflow_runs"]
          prior=[x for x in runs if str(x["id"])!=os.environ["GH_RUN_ID"]]
          if prior and prior[0].get("conclusion")!="success":
              raise SystemExit("STOP: Previous Production transfer did not succeed; no more automatic writes until reviewed")
          print("Previous Production import: healthy or no history")
          PY
      - name: Resume at most 200 new transactions with Production health checks
        run: python scripts/moi_production_paced_resume.py
      - name: Preserve complete/partial audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moi-production-paced-resume-${{ github.run_id }}
          path: /tmp/moi-paced-resume-report.json
          retention-days: 90
