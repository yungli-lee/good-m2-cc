name: MOI staging official source healthcheck
on:
  push:
    branches: [feature/real-price-public-search-v1]
    paths: [.github/workflows/moi-staging-source-healthcheck.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-source:
    if: github.ref == 'refs/heads/feature/real-price-public-search-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official MOI current ZIP (no credentials, no write)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 240 \
            --output /tmp/moi-source-healthcheck.zip \
            'https://plvr.land.moi.gov.tw/Download?type=zip&fileName=lvr_landcsv.zip'
          python - <<'PY'
          import hashlib,zipfile,json
          p='/tmp/moi-source-healthcheck.zip'
          if not zipfile.is_zipfile(p):raise SystemExit('Source is not a ZIP')
          with zipfile.ZipFile(p) as z:
              if z.testzip() is not None:raise SystemExit('ZIP CRC failed')
              files=z.namelist()
          report={'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'files':len(files),'zip_valid':True}
          with open('/tmp/moi-source-healthcheck.json','w') as f:json.dump(report,f)
          print(json.dumps(report))
          PY
      - name: Validate official CSV layout without importing
        env:
          MOI_CHECK_ONLY: '1'
          MOI_LOCAL_ZIP: /tmp/moi-source-healthcheck.zip
        run: python scripts/moi_auto_raw_import.py
      - name: Preserve source checksum and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moi-source-healthcheck-${{ github.run_id }}
          path: /tmp/moi-source-healthcheck.json
          retention-days: 30
